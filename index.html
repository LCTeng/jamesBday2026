  :root{--u:min(1vw,1.7778vh);
    --g:#7be36b;--b:#5aa9ff;--y:#ffd84d;--p:#ff7ac0;--v:#b78cff;--t:#4fe0c8;--o:#ff9d5c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0c0d;cursor:default;
    font-family:"Huninn","jf open 粉圓","Microsoft JhengHei",sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  #back{z-index:1} #fx{z-index:8}

  /* 黑色瓦楞板 */
  #stage{position:fixed;left:50%;top:50%;width:calc(var(--u)*100);height:calc(var(--u)*56.25);
    transform:translate(-50%,-50%);z-index:2}
  body::before{content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.07),transparent 60%),
      repeating-linear-gradient(0deg,#1b1b1d 0,#1b1b1d calc(var(--u)*.34),#111113 calc(var(--u)*.34),#111113 calc(var(--u)*.42)),
      #151516}

  /* ---------- 左:老師照片貼紙 ---------- */
  #photoWrap{position:absolute;left:calc(var(--u)*.5);bottom:calc(var(--u)*-.6);height:calc(var(--u)*51.5);
    transform-origin:50% 100%;animation:rock 7s ease-in-out infinite;z-index:3}
  #photoWrap img{height:100%;display:block;filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(0,0,0,.7))}
  @keyframes rock{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
  .doodle{position:absolute;z-index:3;overflow:visible;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
  .doodle path{stroke-dasharray:200;animation:draw 2.4s ease-in-out infinite alternate}
  .doodle path:nth-child(2){animation-delay:.3s}.doodle path:nth-child(3){animation-delay:.6s}
  @keyframes draw{0%{stroke-dashoffset:200;opacity:0}40%,100%{stroke-dashoffset:0;opacity:1}}
  #wow{position:absolute;left:calc(var(--u)*27.2);top:calc(var(--u)*13.2);z-index:4;font-family:"Caveat",cursive;font-weight:700;
    font-size:calc(var(--u)*5);color:#fff;transform:rotate(-10deg);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(-6deg) scale(1.14)}}
  #hand{position:absolute;left:calc(var(--u)*.8);top:calc(var(--u)*12.5);z-index:4;transform:rotate(-8deg);
    font-size:calc(var(--u)*2.7);color:#fff;-webkit-text-stroke:calc(var(--u)*.5) #111;paint-order:stroke fill;
    animation:hop2 2.2s ease-in-out infinite}
  #hand i{font-style:normal;color:var(--y)}
  @keyframes hop2{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(-5deg) translateY(calc(var(--u)*-.8))}}

  /* ---------- 右上:LCP LAB + 名字 ---------- */
  #head{position:absolute;left:calc(var(--u)*37);top:calc(var(--u)*1.8);width:calc(var(--u)*61.5);height:calc(var(--u)*10);
    display:flex;align-items:center;gap:calc(var(--u)*1.3)}
  .foam{display:flex;gap:calc(var(--u)*.3);font-size:calc(var(--u)*5.3);line-height:1}
  .foam span{display:inline-block;color:var(--c);-webkit-text-stroke:calc(var(--u)*.22) var(--c);
    text-shadow:calc(var(--u)*.18) calc(var(--u)*.3) 0 rgba(0,0,0,.55);
    transform:rotate(var(--r));animation:wig 2.6s ease-in-out infinite;animation-delay:var(--dl)}
  .foam span.sp{width:calc(var(--u)*1.2)}
  @keyframes wig{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r)*-1)) translateY(calc(var(--u)*-.7))}}
  .name{position:relative;font-size:calc(var(--u)*5.2);color:#fff;letter-spacing:.14em;white-space:nowrap;line-height:1.1}
  .name small{font-size:.55em;letter-spacing:.1em;margin-left:.2em;color:var(--y)}
  .name::after{content:"★ ✦ ★ ✦ ★ ✦ ★ ✦ ★ ✦ ★ ✦ ★ ✦ ★";position:absolute;left:0;right:0;bottom:calc(var(--u)*-1.9);
    font-size:calc(var(--u)*1.25);letter-spacing:.12em;color:#e9c04a;white-space:nowrap;overflow:hidden;
    background:#0a0a0a;padding:calc(var(--u)*.1) calc(var(--u)*.4);animation:tw 1.8s ease-in-out infinite}
  @keyframes tw{0%,100%{color:#e9c04a}50%{color:#fff3b8}}
  .badge{margin-left:auto;margin-right:calc(var(--u)*.4);width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;flex:none;position:relative;
    border:calc(var(--u)*.32) solid #ff6b6b;color:#ff6b6b;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-14deg);animation:stamp 4s ease-in-out infinite}
  .badge::before{content:"";position:absolute;inset:calc(var(--u)*.45);border-radius:50%;border:calc(var(--u)*.11) dashed #ff6b6b}
  .badge small{font-size:calc(var(--u)*1.15);letter-spacing:.2em;padding-left:.2em;line-height:1.2}
  .badge b{font-weight:400;font-size:calc(var(--u)*2.95);line-height:1.1;margin-bottom:calc(var(--u)*.9)}
  @keyframes stamp{0%,70%,100%{transform:rotate(-14deg) scale(1)}76%{transform:rotate(-14deg) scale(1.18)}82%{transform:rotate(-14deg) scale(.94)}88%{transform:rotate(-14deg) scale(1)}}

  /* ---------- 生字簿:生日快樂 ---------- */
  #tiles{position:absolute;left:calc(var(--u)*37);top:calc(var(--u)*14.8);width:calc(var(--u)*61.5);display:flex;justify-content:space-between}
  .tile{width:calc(var(--u)*14.6);height:calc(var(--u)*14.6);background:#fffdf7;border-radius:calc(var(--u)*.5);position:relative;
    box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.1) rgba(0,0,0,.6);display:flex;
    transform:rotate(var(--r));animation:jump 3.2s cubic-bezier(.3,.6,.4,1) infinite;animation-delay:var(--dl)}
  .tile::before{content:"";position:absolute;inset:calc(var(--u)*.7);border:calc(var(--u)*.16) solid #222;pointer-events:none}
  .tile::after{content:"";position:absolute;top:calc(var(--u)*.7);bottom:calc(var(--u)*.7);right:calc(var(--u)*5.2);border-left:calc(var(--u)*.12) solid #222}
  .tile b{flex:1;font-weight:400;font-size:calc(var(--u)*8.6);line-height:calc(var(--u)*14.6);text-align:center;color:var(--c);padding-left:calc(var(--u)*.6)}
  .tile em{width:calc(var(--u)*5.2);flex:none;padding-left:calc(var(--u)*.3);font-style:normal;display:flex;flex-direction:column;justify-content:center;align-items:center;
    font-size:calc(var(--u)*1.75);line-height:1.08;color:#333;position:relative;padding-right:calc(var(--u)*1.7)}
  .tile em u{text-decoration:none;position:absolute;right:calc(var(--u)*1.15);top:var(--ty);font-size:calc(var(--u)*1.3);width:calc(var(--u)*.9);text-align:center}
  @keyframes jump{0%,60%,100%{transform:rotate(var(--r)) translateY(0)}12%{transform:rotate(calc(var(--r)*-1.5)) translateY(calc(var(--u)*-1.6)) scale(1.05)}24%{transform:rotate(var(--r)) translateY(0)}}

  /* ---------- Happy Birthday ---------- */
  #hb{position:absolute;left:calc(var(--u)*37);top:calc(var(--u)*32.4);width:calc(var(--u)*61.5);text-align:center;
    font-family:"Pacifico",cursive;font-size:calc(var(--u)*8.1);line-height:1.35;white-space:nowrap;transform:rotate(-2deg)}
  #hb span{display:inline-block;color:var(--c);text-shadow:calc(var(--u)*.2) calc(var(--u)*.3) 0 rgba(0,0,0,.6);
    animation:wave 2s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
  @keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-.9))}}


  #foot{position:absolute;left:calc(var(--u)*37);top:calc(var(--u)*48.6);width:calc(var(--u)*61.5);text-align:center;
    font-size:calc(var(--u)*2.6);letter-spacing:.3em;color:#fff;white-space:nowrap}
  #foot::before,#foot::after{content:"✦";color:var(--y);margin:0 .6em;display:inline-block;animation:tw2 1.6s ease-in-out infinite}
  @keyframes tw2{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4) rotate(30deg);opacity:.6}}
  #hint{position:fixed;right:1vw;bottom:.6vh;z-index:9;font-size:calc(var(--u)*.85);color:rgba(255,255,255,.45);transition:opacity 1s}
</style>
</head>

const b=back.getContext('2d'),f=fx.getContext('2d');
let W,H,DPR;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const COLORS=['#ffd84d','#ff7ac0','#5aa9ff','#b78cff','#7be36b','#ff9d5c','#ffffff'];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const c of [back,fx]){c.width=W*DPR;c.height=H*DPR;}
  b.setTransform(DPR,0,0,DPR,0,0);f.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* 金色星星貼紙(閃爍) */
const stars=[];for(let i=0;i<46;i++)stars.push({x:Math.random(),y:Math.random(),s:rand(.5,1.3),ph:rand(0,6.28),sp:rand(.8,2.2),r:rand(0,1)});
function star(c,x,y,R,rot){c.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,r=i%2?R*.45:R;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();c.fill();}
let avoid=[];
function updAvoid(){avoid=[...document.querySelectorAll('.badge')].map(e=>{const r=e.getBoundingClientRect(),m=r.width*.15;return {l:r.left-m,r:r.right+m,t:r.top-m,b:r.bottom+m};});}
addEventListener('resize',updAvoid);addEventListener('load',updAvoid);document.fonts&&document.fonts.ready.then(updAvoid);updAvoid();
function drawStars(t){for(const s of stars){const sx=s.x*W,sy=s.y*H;if(avoid.some(r=>sx>r.l&&sx<r.r&&sy>r.t&&sy<r.b))continue;const a=.25+.75*Math.pow(.5+.5*Math.sin(t*s.sp+s.ph),2);
  b.fillStyle=`rgba(233,192,74,${a*.8})`;star(b,s.x*W,s.y*H,s.s*W/150*(.7+.3*a),s.r+t*.2);}}

/* 煙火 */
const rockets=[],sparks=[];
function launch(x,y){rockets.push({x:x??rand(.1,.9)*W,y:H,ty:y??rand(.1,.45)*H,hue:rand(0,360)});}
function burst(x,y,hue){const n=80,sp=Math.min(W,H)/140,ring=Math.random()<.35;
  for(let i=0;i<n;i++){const a=rand(0,6.283),v=ring?sp*1.1:rand(.2,1.25)*sp;
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:rand(.009,.018),hue:hue+rand(-25,25)});}}
function drawFireworks(){b.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y-=H/55;
    b.fillStyle=`hsl(${r.hue},100%,80%)`;b.beginPath();b.arc(r.x,r.y,3,0,6.283);b.fill();
    if(r.y<=r.ty){burst(r.x,r.y,r.hue);rockets.splice(i,1);}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];
    s.vx*=.975;s.vy=s.vy*.975+.035;const px=s.x,py=s.y;s.x+=s.vx;s.y+=s.vy;s.life-=s.dec;
    if(s.life<=0){sparks.splice(i,1);continue;}
    b.strokeStyle=`hsla(${s.hue},100%,${55+s.life*30}%,${s.life*.8})`;b.lineWidth=2.2*s.life+.6;
    b.beginPath();b.moveTo(px-s.vx*2,py-s.vy*2);b.lineTo(s.x,s.y);b.stroke();}
  b.globalCompositeOperation='source-over';}

/* 彩帶紙片 */
const conf=[];
function newConf(init){return {x:rand(0,W),y:init?rand(-H,H):rand(-.2,-.02)*H,w:rand(7,15)*(W/1600+.4),h:rand(4,9)*(W/1600+.4),
  vx:rand(-.4,.4),vy:rand(.7,1.9),rot:rand(0,6.28),vr:rand(-.1,.1),ph:rand(0,6.28),c:pick(COLORS),circ:Math.random()<.25,burst:false};}
function drawConfetti(t){f.clearRect(0,0,W,H);
  for(let i=conf.length-1;i>=0;i--){const c=conf[i];
    if(c.burst){c.vy+=.22;c.vx*=.985;c.vy=Math.min(c.vy,3.2);}
    c.x+=c.vx+Math.sin(t*1.5+c.ph)*.8;c.y+=c.vy*(H/900);c.rot+=c.vr;
    if(c.y>H+20){if(c.burst){conf.splice(i,1);continue;}Object.assign(c,newConf(false));}
    f.save();f.translate(c.x,c.y);f.rotate(c.rot);f.scale(1,Math.cos(t*3+c.ph));f.fillStyle=c.c;f.globalAlpha=.9;
    if(c.circ){f.beginPath();f.arc(0,0,c.h*.8,0,6.283);f.fill();}else f.fillRect(-c.w/2,-c.h/2,c.w,c.h);f.restore();}}
function shower(){for(let i=0;i<260;i++){const left=i%2,c=newConf(false);c.burst=true;c.x=left?W*.02:W*.98;c.y=H*.95;
  c.vx=(left?1:-1)*rand(3,16);c.vy=rand(-22,-8);conf.push(c);}}

let nextFw=2;
function frame(ms){const t=ms/1000;b.clearRect(0,0,W,H);
  drawStars(t);drawFireworks();drawConfetti(t);
  if(t>nextFw){launch();nextFw=t+rand(2.5,5);}
  requestAnimationFrame(frame);}
for(let i=0;i<70;i++)conf.push(newConf(true));
requestAnimationFrame(frame);

addEventListener('pointerdown',e=>{burst(e.clientX,e.clientY,rand(0,360));launch();launch();});
addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  if(e.code==='Space'){e.preventDefault();celebrate();}});
setTimeout(()=>document.getElementById('hint').style.opacity=0,12000);
/* 每 10 秒自動噴彩帶+煙火 */
function celebrate(){shower();for(let i=0;i<5;i++)setTimeout(launch,i*180);}
setTimeout(celebrate,3000);setInterval(celebrate,10000);
let hideT;addEventListener('mousemove',()=>{document.body.style.cursor='default';clearTimeout(hideT);hideT=setTimeout(()=>document.body.style.cursor='none',3000);});
})();
</script>
</body>
</html>
